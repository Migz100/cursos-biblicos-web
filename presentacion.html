<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<title>Presentación</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="presentationViewer">
  <div class="readerNav presentationNav">
    <a class="navBtn ghost presentationBack" id="back" href="index.html">Curso</a>
    <div class="title" id="title">Cargando presentación...</div>
    <button class="navBtn" id="fullScreen" type="button">Pantalla completa</button>
    <button class="navBtn ghost" id="download" type="button" disabled>Descargar PPTX</button>
  </div>
  <div class="presentationControls" aria-label="Controles de la presentación">
    <button class="navBtn ghost" id="previous" type="button" disabled>Anterior</button>
    <label class="presentationPageLabel" for="pageNumber">
      Diapositiva
      <input id="pageNumber" type="number" inputmode="numeric" min="1" value="1" disabled>
      de <span id="pageCount">0</span>
    </label>
    <button class="navBtn ghost" id="next" type="button" disabled>Siguiente</button>
  </div>
  <main class="presentationStage" id="stage" tabindex="0">
    <div class="presentationStatus" id="status" role="status">Preparando la presentación...</div>
    <canvas id="slideCanvas" aria-label="Diapositiva actual" hidden></canvas>
    <div class="presentationFallback" id="fallback" role="alert" hidden>
      <strong>No se pudo mostrar la presentación.</strong>
      <span>Intenta volver a abrir esta lección.</span>
    </div>
  </main>
</div>
<script type="module" src="presentation.js"></script>
</body>
</html>
