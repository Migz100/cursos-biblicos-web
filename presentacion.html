<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<title>Presentación</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="presentationViewer">
  <nav class="readerNav presentationNav" aria-label="Navegación de la presentación">
    <a class="navBtn ghost presentationBack" id="back" href="index.html">Curso</a>
    <div class="title" id="title">Cargando presentación...</div>
    <button class="navBtn" id="fullScreen" type="button">Pantalla completa</button>
    <a class="navBtn ghost" id="openViewer" target="_blank" rel="noopener" hidden>Abrir aparte</a>
    <button class="navBtn ghost" id="openTranscript" type="button" aria-controls="presentationTranscript" aria-expanded="false" hidden>Texto y citas</button>
    <button class="navBtn ghost" id="download" type="button" disabled>Descargar</button>
  </nav>
  <main class="presentationStage" id="stage">
    <div class="presentationStatus" id="status" role="status">Preparando la presentación...</div>
    <iframe
      id="presentationFrame"
      title="Visor de presentación"
      referrerpolicy="no-referrer"
      sandbox="allow-downloads allow-forms allow-same-origin allow-scripts"
      allow="fullscreen"
      allowfullscreen
      hidden></iframe>
    <div class="presentationFallback" id="fallback" hidden>
      <strong>No se pudo mostrar la presentación.</strong>
      <span>Puedes abrir el visor en otra pestaña o descargar el archivo.</span>
    </div>
    <aside class="presentationTranscript" id="presentationTranscript" role="dialog" aria-modal="true" aria-labelledby="transcriptTitle" hidden>
      <header class="transcriptHeader">
        <div>
          <h2 id="transcriptTitle">Texto y citas b&iacute;blicas</h2>
          <p id="transcriptSummary">Texto accesible de cada diapositiva.</p>
        </div>
        <button class="wBtn" id="closeTranscript" type="button">Cerrar</button>
      </header>
      <div class="transcriptSlides" id="transcriptSlides"></div>
    </aside>
  </main>
</div>
<script src="verses.js"></script>
<script src="presentation.js"></script>
</body>
</html>
