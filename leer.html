<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<title>Lección</title>
<link rel="stylesheet" href="styles.css">
<script src="vendor/jspdf.umd.min.js"></script>
</head>
<body>
<div class="reader">
  <nav class="readerNav" aria-label="Navegación de la lección">
    <button class="navBtn ghost" id="back">Cursos</button>
    <h1 class="title" id="title">Lecci&oacute;n</h1>
    <span class="count" id="count"></span>
    <button class="navBtn" id="prev">Anterior</button>
    <button class="navBtn" id="next">Siguiente</button>
  </nav>
  <section class="answerTools" id="answerTools" aria-label="Herramientas para responder">
    <div class="zoomTools" role="group" aria-label="Tamaño de la lección">
      <button class="wBtn" id="zoomOut" title="Reducir el tamaño de la lección">Texto −</button>
      <span class="zoomValue" id="zoomValue" aria-live="polite">100%</span>
      <button class="wBtn" id="zoomIn" title="Aumentar el tamaño de la lección">Texto +</button>
      <button class="wBtn" id="zoomFit" title="Ajustar la lección al ancho">Ajustar</button>
      <button class="wBtn" id="rotatePage" type="button" title="Girar la p&aacute;gina actual 90 grados">Girar p&aacute;gina</button>
    </div>
    <span class="toolSpacer"></span>
    <span class="answerHint" id="answerHint" aria-live="polite">Toca un recuadro para responder con el teclado.</span>
    <div class="answerActions">
      <a class="wBtn downloadTool" id="downloadOriginal" target="_blank" rel="noopener" hidden>PDF original</a>
      <button class="wBtn" id="clearAnswers" title="Borrar las respuestas guardadas">Borrar respuestas</button>
      <button class="wBtn primaryTool" id="savePdf" title="Descargar PDF con respuestas">Guardar PDF</button>
    </div>
  </section>
  <main class="pdfArea" id="pdfArea">
    <nav class="pdfNav" aria-label="Navegación entre páginas" hidden>
      <button class="navBtn ghost" id="pgPrev">Página anterior</button>
      <span class="count" id="pgCount" aria-live="polite"></span>
      <button class="navBtn ghost" id="pgNext">Página siguiente</button>
    </nav>
    <p class="scrollHint" id="scrollHint" hidden>Desliza hacia abajo para ver todas las páginas. También puedes usar los botones.</p>
    <div id="pdfBox"></div>
  </main>
</div>
<script src="verses.js"></script>
<script type="module" src="reader.js"></script>
</body>
</html>
